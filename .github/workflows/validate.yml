name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  authority:
    # Enterprise R640 runners are isolated for untrusted/offline build work.
    # The Macmini remains a service-backend repository runner until it is
    # deliberately re-registered at enterprise scope.
    runs-on: [self-hosted, Linux, X64, r640, untrusted-build]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0.2'
      - run: python -m unittest discover -s operations/releases -p 'test_*.py'
      - run: python scripts/validate_authority.py
