name: Daily accepted storage reconcile
on:
  schedule:
    - cron: '17 2 * * *'
permissions: {}
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    permissions: {actions: write}
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run storage-static-release.yml -R "$GITHUB_REPOSITORY" --ref main -f contract=contracts/releases/main-domain/main-data-storage-toolhive-system.yaml -f mode=reconcile -f execute=true
